name: Deploy to Production

on:
  workflow_run:
    workflows:
      - CI and Publish Images
    types:
      - completed

jobs:
  deploy:
    name: Release Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      secrets.PROD_HOST != '' &&
      secrets.PROD_USER != '' &&
      secrets.PROD_SSH_PRIVATE_KEY != '' &&
      secrets.PROD_ENV_FILE != ''
    permissions:
      contents: read
    steps:
      - name: Checkout repository at deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Prepare production env file
        run: |
          mkdir -p "$RUNNER_TEMP/anaconda"
          printf '%s' '${{ secrets.PROD_ENV_FILE }}' > "$RUNNER_TEMP/anaconda/.env.prod"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Add production host to known_hosts
        run: ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Run release-based deploy
        run: |
          ansible-playbook -i "${{ secrets.PROD_HOST }}," infra/ansible/deploy.yml \
            -u "${{ secrets.PROD_USER }}" \
            -e deployment_action=deploy \
            -e deployment_ref=${{ github.event.workflow_run.head_sha }} \
            -e release_id=${{ github.event.workflow_run.head_sha }} \
            -e env_local_path="$RUNNER_TEMP/anaconda/.env.prod" \
            -e ghcr_username="${{ secrets.PROD_GHCR_USERNAME || github.actor }}" \
            -e ghcr_token="${{ secrets.PROD_GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
            -e app_root="${{ vars.PROD_APP_ROOT || '/opt/anaconda-site' }}" \
            -e web_health_url="${{ vars.PROD_WEB_HEALTH_URL || 'http://127.0.0.1:26300/' }}" \
            -e api_health_url="${{ vars.PROD_API_HEALTH_URL || 'http://127.0.0.1:26800/api/v1/health' }}"