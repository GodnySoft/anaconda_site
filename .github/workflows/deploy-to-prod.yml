name: Production Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: Операция с production
        required: true
        default: status
        type: choice
        options:
          - status
          - deploy
          - rollback
      ref:
        description: Git ref для ручного deploy
        required: false
        default: main
        type: string
      release_id:
        description: Release ID для rollback или ручного deploy
        required: false
        default: ''
        type: string

jobs:
  operations:
    name: Production Operations
    runs-on: ubuntu-latest
    if: >-
      secrets.PROD_HOST != '' &&
      secrets.PROD_USER != '' &&
      secrets.PROD_SSH_PRIVATE_KEY != ''
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Prepare production env file
        if: inputs.action == 'deploy'
        run: |
          mkdir -p "$RUNNER_TEMP/anaconda"
          printf '%s' '${{ secrets.PROD_ENV_FILE }}' > "$RUNNER_TEMP/anaconda/.env.prod"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Add production host to known_hosts
        run: ssh-keyscan -H ${{ secrets.PROD_HOST }} >> ~/.ssh/known_hosts

      - name: Run production operation
        run: |
          EXTRA_VARS=(
            -e "deployment_action=${{ inputs.action }}"
            -e "deployment_ref=${{ inputs.ref }}"
            -e "release_id=${{ inputs.release_id != '' && inputs.release_id || github.sha }}"
            -e "rollback_release_id=${{ inputs.release_id }}"
            -e "app_root=${{ vars.PROD_APP_ROOT || '/opt/anaconda-site' }}"
            -e "web_health_url=${{ vars.PROD_WEB_HEALTH_URL || 'http://127.0.0.1:26300/' }}"
            -e "api_health_url=${{ vars.PROD_API_HEALTH_URL || 'http://127.0.0.1:26800/api/v1/health' }}"
            -e "ghcr_username=${{ secrets.PROD_GHCR_USERNAME || github.actor }}"
            -e "ghcr_token=${{ secrets.PROD_GHCR_TOKEN || secrets.GITHUB_TOKEN }}"
          )

          if [ "${{ inputs.action }}" = "deploy" ]; then
            EXTRA_VARS+=( -e "env_local_path=$RUNNER_TEMP/anaconda/.env.prod" )
          fi

          ansible-playbook -i "${{ secrets.PROD_HOST }}," infra/ansible/deploy.yml \
            -u "${{ secrets.PROD_USER }}" \
            "${EXTRA_VARS[@]}"