version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: anaconda_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/godnysoft/anaconda_site/api:latest
    container_name: anaconda_api_prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    image: ghcr.io/godnysoft/anaconda_site/web:latest
    container_name: anaconda_web_prod
    command: npm run start
    env_file:
      - ./.env.prod
    depends_on:
      - api
    restart: always

volumes:
  postgres_data_prod:
    driver: local
