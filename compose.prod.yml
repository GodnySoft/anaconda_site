services:
  postgres:
    image: postgres:16-alpine
    container_name: anaconda_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-anaconda}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${ANACONDA_POSTGRES_PORT:-26543}:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ghcr.io/godnysoft/anaconda_site/api:${ANACONDA_IMAGE_TAG:-latest}
    container_name: anaconda_api_prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env.prod
    ports:
      - "127.0.0.1:${ANACONDA_API_PORT:-26800}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    image: ghcr.io/godnysoft/anaconda_site/web:${ANACONDA_IMAGE_TAG:-latest}
    container_name: anaconda_web_prod
    command: npm run start
    env_file:
      - ./.env.prod
    ports:
      - "127.0.0.1:${ANACONDA_WEB_PORT:-26300}:3000"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data_prod:
    driver: local