services:
  postgres:
    image: postgres:16-alpine
    container_name: anaconda_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-anaconda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${ANACONDA_POSTGRES_PORT:-26543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: anaconda_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
    ports:
      - "${ANACONDA_API_PORT:-26800}:8000"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: anaconda_web
    command: npm run dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${ANACONDA_WEB_PORT:-26300}:3000"
    env_file:
      - ./.env
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
